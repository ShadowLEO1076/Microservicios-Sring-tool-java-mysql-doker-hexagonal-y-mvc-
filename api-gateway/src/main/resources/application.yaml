server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: users-route
          uri: lb://USERS-SERVICE
          predicates:
            - Path=/users-service/**
          filters:
            - StripPrefix=1
      discovery:
        locator:
          enabled: true # Esto ayuda a encontrar rutas automáticamente

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true